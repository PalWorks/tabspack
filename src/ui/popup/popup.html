<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName">TabsPack</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="popup/popup.css" />
  </head>
  <body class="popup">
    <header class="app-bar">
      <span class="wordmark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M4 4h16a1 1 0 0 1 1 1v3H3V5a1 1 0 0 1 1-1zm-1 6h12v3H3v-3zm0 5h9v3H3v-3zm14.5 6L21 17h-2.5v-4h-2v4H14l3.5 4z"
          />
        </svg>
        <span data-i18n="extName">TabsPack</span>
      </span>
      <button id="open-settings" class="icon-btn" type="button" data-i18n-attr="aria-label:openSettings,title:openSettings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65a.49.49 0 0 0-.49-.42h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.22.08.48 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
          />
        </svg>
      </button>
    </header>

    <main>
      <p id="summary" class="summary" data-i18n="readingTabs">Reading tabs</p>

      <div id="scope" class="segmented" role="radiogroup" data-i18n-attr="aria-label:scopeGroupLabel">
        <button type="button" role="radio" data-value="all_windows" aria-checked="true" data-i18n="scopeAllWindows">All windows</button>
        <button type="button" role="radio" data-value="current_window" aria-checked="false" data-i18n="scopeThisWindow">This window</button>
        <button type="button" role="radio" data-value="selection" aria-checked="false" data-i18n="scopeSelectionShort">Selection</button>
      </div>

      <div class="row actions">
        <button id="export" class="btn btn-primary" type="button" disabled data-i18n="exportButton">Export</button>
        <button id="import" class="btn btn-secondary" type="button" data-i18n="taskImport" data-i18n-attr="title:importHint">
          Import
        </button>
      </div>

      <div class="row format-row">
        <label class="field-label" for="format" data-i18n="formatLabel">Format</label>
        <select id="format">
          <option value="tabspack" data-i18n="formatPack">TabsPack file</option>
          <option value="urls" data-i18n="formatUrls">URL list, one way</option>
          <option value="flatjson" data-i18n="formatFlat">Flat JSON, one way</option>
        </select>
        <button id="copy" class="btn btn-secondary" type="button" disabled data-i18n="copyButton">Copy</button>
      </div>

      <div id="report" class="report" role="status" aria-live="polite"></div>
    </main>

    <footer class="trust" data-i18n="trustLine">Nothing leaves your device.</footer>
    <script src="popup/popup.js" defer></script>
  </body>
</html>
