<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="placeholderTitle">Addresses TabsPack could not open</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="placeholder/placeholder.css" />
  </head>
  <body>
    <div class="page narrow">
      <header class="page-head">
        <span class="wordmark">
          <img src="icons/icon-32.png" width="20" height="20" alt="" />
          <span data-i18n="extName">TabsPack</span>
        </span>
        <span class="page-trust" data-i18n="trustLine">Your tabs never leave this device.</span>
      </header>

      <section class="card">
        <h1 id="headline" class="title" data-i18n="placeholderHeadline">Addresses that could not be reopened</h1>
        <p id="lead" class="lead" data-i18n="placeholderReading">Reading the list</p>
        <div class="row">
          <button id="copy" class="btn btn-secondary" type="button" data-i18n="copyAll">Copy all</button>
          <span id="copy-note" class="hint" role="status" aria-live="polite"></span>
        </div>
        <ul id="list" class="url-list"></ul>
        <p class="hint" data-i18n="placeholderWhy">These addresses are still in your pack file. They are shown as plain text, not as links, because a browser will not let an extension open them and some of them should never be opened by a click.</p>
      </section>
    </div>
    <script src="placeholder/placeholder.js" defer></script>
  </body>
</html>
