<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Addresses TabsPack could not open</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <link rel="stylesheet" href="shared/base.css" />
    <link rel="stylesheet" href="placeholder/placeholder.css" />
  </head>
  <body>
    <div class="page narrow">
      <header class="page-head">
        <span class="wordmark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M4 4h16a1 1 0 0 1 1 1v3H3V5a1 1 0 0 1 1-1zm-1 6h12v3H3v-3zm0 5h9v3H3v-3zm14.5 6L21 17h-2.5v-4h-2v4H14l3.5 4z"
            />
          </svg>
          TabsPack
        </span>
        <span class="page-trust">Nothing leaves your device.</span>
      </header>

      <section class="card">
        <h1 id="headline" class="title">Addresses that could not be reopened</h1>
        <p id="lead" class="lead">Reading the list</p>
        <div class="row">
          <button id="copy" class="btn btn-secondary" type="button">Copy all</button>
          <span id="copy-note" class="hint" role="status" aria-live="polite"></span>
        </div>
        <ul id="list" class="url-list"></ul>
        <p class="hint">
          These addresses are still in your pack file. They are shown as plain text, not as links,
          because a browser will not let an extension open them and some of them should never be
          opened by a click.
        </p>
      </section>
    </div>
    <script src="placeholder/placeholder.js" defer></script>
  </body>
</html>
