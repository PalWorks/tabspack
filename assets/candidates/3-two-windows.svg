<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TabsPack">
  <!--
    3. Two windows.

    The product's whole sentence in one shape: a session, and a second place for
    it to be. Two tabbed windows, one behind the other, so the mark says "from
    here to there" without drawing an arrow, which is the part every export icon
    in the store already has.

    Amber, for the same reason as the others: a browser toolbar is a row of blue
    squares.
  -->
  <defs>
    <linearGradient id="t-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f08c00" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#t-face)" />
  <g fill="#ffffff">
    <g opacity="0.45">
      <path d="M62 36 V30 A6 6 0 0 1 68 24 H74 A6 6 0 0 1 80 30 V36 Z" />
      <rect x="54" y="36" width="54" height="40" rx="10" />
    </g>
    <path d="M28 58 V50 A6 6 0 0 1 34 44 H42 A6 6 0 0 1 48 50 V58 Z" />
    <rect x="20" y="58" width="60" height="46" rx="11" />
  </g>
</svg>
