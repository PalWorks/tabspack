<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TabsPack" style="--brand:#4338ca;--brand-2:#6366f1">
  <!--
    4. The T, packed.

    The two ideas at once: the letter inside the brackets. It says the name and
    the verb in one mark, and it is the only one here that could carry a
    wordmark without repeating itself. The risk is that two ideas is one more
    than 16 px can hold, which is exactly what this sheet is for.
  -->
  <defs>
    <linearGradient id="b4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--brand-2)" /><stop offset="1" stop-color="var(--brand)" />
    </linearGradient>
  </defs>
  <rect class="bg" width="128" height="128" rx="28" fill="url(#b4-bg)" />
  <g class="fg" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 28H24v72h12" />
    <path d="M92 28h12v72H92" />
  </g>
  <g class="fg" fill="#ffffff">
    <rect x="46" y="36" width="36" height="17" rx="8" />
    <rect x="55" y="53" width="18" height="43" rx="9" />
  </g>
</svg>
