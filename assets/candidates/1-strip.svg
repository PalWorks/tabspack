<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TabsPack">
  <!--
    1. The strip.

    Three tabs of one width on one page, with the active one lit: the shape a
    browser makes and nothing else does. Earlier drafts made the middle tab
    wider as well as taller, which turned the whole thing into a bag with a
    handle. Same width, a little taller, is the difference.
  -->
  <defs>
    <linearGradient id="s-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#s-face)" />
  <g fill="#ffffff">
    <path opacity='0.45' d="M21.0 54 V44 A6 6 0 0 1 27.0 38 H39.0 A6 6 0 0 1 45.0 44 V54 Z" />
    <path d="M52.0 54 V40 A6 6 0 0 1 58.0 34 H70.0 A6 6 0 0 1 76.0 40 V54 Z" />
    <path opacity='0.45' d="M83.0 54 V44 A6 6 0 0 1 89.0 38 H101.0 A6 6 0 0 1 107.0 44 V54 Z" />
    <rect x="18" y="54" width="92" height="48" rx="12" />
  </g>
</svg>
